# One command: MySQL + Spring Boot API + React site.   docker compose up --build
services:
  db:
    image: mysql:8.4
    environment: { MYSQL_DATABASE: astrovitals, MYSQL_USER: astro, MYSQL_PASSWORD: astro, MYSQL_ROOT_PASSWORD: root }
    healthcheck: { test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"], interval: 5s, timeout: 5s, retries: 20 }
    volumes: [dbdata:/var/lib/mysql]
  backend:
    build: ./backend
    depends_on: { db: { condition: service_healthy } }
    environment:
      SPRING_PROFILES_ACTIVE: mysql
      DB_URL: jdbc:mysql://db:3306/astrovitals?serverTimezone=UTC
      APP_CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports: ["8080:8080"]
  frontend:
    build: { context: ./frontend, args: { API_URL: "http://localhost:8080" } }
    depends_on: [backend]
    ports: ["5173:80"]
volumes: { dbdata: {} }
