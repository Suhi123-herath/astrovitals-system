# Default profile: in-memory H2 (zero setup, ideal for the hosted demo). Use --spring.profiles.active=mysql for MySQL.
spring:
  application:
    name: astrovitals
  datasource:
    url: jdbc:h2:mem:astrovitals;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
app:
  cors:
    allowed-origins: http://localhost:5173
management:
  endpoints:
    web:
      exposure:
        include: health,info
